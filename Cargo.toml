[workspace]
resolver = "2"
members = ["crates/nh-core", "crates/nh"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Releaseworthy/native-harness"

# The whole dependency list (PLAN.md, D1): adding a crate needs the owner's OK.
[workspace.dependencies]
nh-core = { path = "crates/nh-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = { version = "3.5.1", default-features = false, features = ["rustls", "platform-verifier"] }
regex = "1.13.1"
ignore = "0.4.34"
ratatui = "0.30.2"
crossterm = "0.29.0"
pulldown-cmark = { version = "0.13.6", default-features = false }
slint = "1.18.1"
slint-build = "1.18.1"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[profile.dev]
debug = 1
