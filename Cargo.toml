[workspace]
resolver = "2"
members = ["crates/fast-harness-core", "crates/fast-harness", "crates/fast-harness-gui", "crates/fast-harness-plugins"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Releaseworthy/fast-harness"

# The whole dependency list (PLAN.md, D1): adding a crate needs the owner's OK.
[workspace.dependencies]
fast-harness-core = { path = "crates/fast-harness-core" }
# The generated register_all of native plugins (PLAN.md D52, docs/plugins.md).
fast-harness-plugins = { path = "crates/fast-harness-plugins" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = { version = "3.5.1", default-features = false, features = ["rustls", "platform-verifier"] }
regex = "1.13.1"
ignore = "0.4.34"
ratatui = "0.30.2"
crossterm = "0.29.0"
pulldown-cmark = { version = "0.13.6", default-features = false }
slint = { version = "1.18.1", default-features = false, features = ["std", "compat-1-2", "accessibility", "backend-winit", "renderer-software", "renderer-skia", "unstable-winit-030"] }
slint-build = "1.18.1"
# Optional variant only (fast-harness-gui-live, feature ui-files), pending owner OK (PLAN.md D1, D51).
slint-interpreter = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-2", "display-diagnostics"] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[profile.dev]
debug = 1

# A plugin's git dependency on fast-harness-core resolves to this checkout, so
# plugins and the binaries share one core; written by scripts/apply-plugins.ts
# only when plugins.toml lists plugins (an unused patch makes cargo warn).
