[package]
name = "my-plugin"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "A Fast Harness native plugin: an example tool and panel."

[lib]
path = "src/lib.rs"

[dependencies]
# The same Fast Harness the workflow builds (`ref` in .github/workflows/build.yml).
# Pin a tag (`tag = "v0.2.0"`) once Fast Harness publishes one; `main` until then.
fast-harness-core = { git = "https://github.com/Releaseworthy/fast-harness", branch = "main" }
serde_json = "1"
